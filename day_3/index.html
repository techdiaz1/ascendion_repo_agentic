<!DOCTYPE html>

<html>

<head>

    <title>AI Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: white;

            color: #262730;
        }


        /* =====================
           APP
        ===================== */

        .app {

            display: flex;

            height: 100vh;
        }


        /* =====================
           SIDEBAR
        ===================== */

        .sidebar {

            width: 260px;

            background: #f7f7f8;

            border-right: 1px solid #e5e5e5;

            padding: 16px;
        }


        .logo {

            font-size: 20px;

            font-weight: 600;

            margin-bottom: 18px;
        }


        .new-chat {

            width: 100%;

            padding: 10px;

            background: white;

            border: 1px solid #d9d9d9;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;
        }


        .new-chat:hover {

            border-color: #ff4f9a;
        }


        .chat-list {

            margin-top: 20px;
        }


        .chat-item {

            padding: 9px 10px;

            margin-bottom: 4px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .chat-item:hover {

            background: #eaeaea;
        }


        /* =====================
           MAIN
        ===================== */

        .main {

            flex: 1;

            display: flex;

            flex-direction: column;

            height: 100vh;
        }


        .header {

            padding: 16px 25px;

            border-bottom: 1px solid #eeeeee;

            font-size: 18px;

            font-weight: 600;
        }


        /* =====================
           CHAT
        ===================== */

        #chat-box {

            flex: 1;

            overflow-y: auto;

            padding: 30px;

            max-width: 900px;

            width: 100%;

            margin: auto;
        }


        .message {

            margin: 18px 0;

            line-height: 1.6;

            font-size: 15px;

            white-space: pre-wrap;
        }


        .user {

            background: #fff0f6;

            padding: 10px 14px;

            border-radius: 8px;

            margin-left: auto;

            max-width: 70%;

            width: fit-content;
        }


        .assistant {

            max-width: 80%;
        }


        /* =====================
           INPUT
        ===================== */

        .input-container {

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 15px 30px 25px;
        }


        .input-area {

            display: flex;

            border: 1px solid #d9d9d9;

            border-radius: 10px;

            padding: 5px;

            background: white;
        }


        #message {

            flex: 1;

            border: none;

            outline: none;

            padding: 12px;

            font-size: 15px;
        }


        #send {

            border: none;

            border-radius: 7px;

            padding: 10px 18px;

            background: #ff4f9a;

            color: white;

            cursor: pointer;
        }


        #send:hover {

            background: #e83e8c;
        }


        #send:disabled {

            background: #cccccc;

            cursor: not-allowed;
        }


        .hint {

            text-align: center;

            font-size: 12px;

            color: #888;

            margin-top: 8px;
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================
         SIDEBAR
    ====================== -->

    <div class="sidebar">

        <div class="logo">
            AI Chatbot
        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >
            + New Chat
        </button>


        <div
            id="chat-list"
            class="chat-list"
        ></div>

    </div>



    <!-- =====================
         MAIN
    ====================== -->

    <div class="main">


        <div class="header">
            DeepSeek Chat
        </div>


        <div id="chat-box"></div>


        <div class="input-container">

            <div class="input-area">

                <input
                    id="message"
                    type="text"
                    placeholder="Ask something..."
                >


                <button
                    id="send"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>


            <div class="hint">
                AI can make mistakes. Check important information.
            </div>

        </div>


    </div>

</div>



<script>


// Current conversation

let currentChat = null;


// =========================
// New Chat
// =========================

async function newChat() {

    const response =
        await fetch(
            "/new-chat",
            {
                method: "POST"
            }
        );


    const data =
        await response.json();


    currentChat =
        data.chat_id;


    document
        .getElementById("chat-box")
        .innerHTML = "";


    loadChats();

}



// =========================
// Load Chat List
// =========================

async function loadChats() {

    const response =
        await fetch("/chats");


    const chats =
        await response.json();


    const list =
        document.getElementById(
            "chat-list"
        );


    list.innerHTML = "";


    chats.forEach(chat => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "chat-item";


        div.innerText =
            chat.title;


        div.onclick = function() {

            loadChat(
                chat.chat_id
            );

        };


        list.appendChild(div);

    });

}



// =========================
// Load Conversation
// =========================

async function loadChat(chatId) {

    currentChat = chatId;


    const response =
        await fetch(
            `/chats/${chatId}`
        );


    const messages =
        await response.json();


    const chatBox =
        document.getElementById(
            "chat-box"
        );


    chatBox.innerHTML = "";


    messages.forEach(message => {

        addMessage(
            message.role,
            message.content
        );

    });

}



// =========================
// Send Message
// =========================

async function sendMessage() {

    const input =
        document.getElementById(
            "message"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    // Create chat if needed

    if (!currentChat) {

        await newChat();

    }


    // Show user message

    addMessage(
        "user",
        message
    );


    input.value = "";


    // Disable button

    const button =
        document.getElementById(
            "send"
        );

    button.disabled = true;


    // Create empty AI message

    const aiMessage =
        addMessage(
            "assistant",
            ""
        );


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        chat_id:
                            currentChat,

                        message:
                            message

                    })

                }
            );


        // Read streaming response

        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder();


        let fullText = "";


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {

                break;

            }


            const text =
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            fullText += text;


            // Update AI message
            // immediately

            aiMessage.innerText =
                fullText;


            const chatBox =
                document.getElementById(
                    "chat-box"
                );


            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        loadChats();


    }

    catch (error) {

        aiMessage.innerText =
            "Something went wrong.";

        console.error(error);

    }


    button.disabled = false;

}



// =========================
// Add Message
// =========================

function addMessage(
    role,
    content
) {

    const chatBox =
        document.getElementById(
            "chat-box"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + role;


    div.innerText =
        content;


    chatBox.appendChild(div);


    chatBox.scrollTop =
        chatBox.scrollHeight;


    return div;

}



// =========================
// Enter Key
// =========================

document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );



// Load chats on startup

loadChats();

</script>


</body>

</html>
